[package]
name = "fragile-sky"
version = "0.1.0"
authors = ["Ellis Hoag <ellis.sparky.hoag@gmail.com>"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

esp-hal = { version = "1.1.0", features = ["esp32c6", "unstable"] }
esp-alloc = { version = "0.10.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "println", "panic-handler"] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
embedded-hal-bus = "0.3.0"
esp-radio = { version = "1.0.0-beta.0", features = ["esp32c6", "wifi", "esp-now", "esp-alloc", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "esp-radio", "esp-alloc", "embassy"] }
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }
embassy-executor = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"

reqwless = { version = "0.14.0", default-features = false }
serde_json = { version = "1.0.103", default-features = false, features = ["alloc"] }

epd-waveshare = "0.6.0"
embedded-graphics = "0.8.2"

chrono = { version = "0.4.24", default-features = false }
thiserror-no-std = "2.0.2"
anyhow = { version = "1.0.75", default-features = false }
toml-cfg = "0.2.0"
static_cell = "2.1.0"

[profile.dev.package.esp-radio]
opt-level = 2

[dev-dependencies]
espflash = "4.5.0"
